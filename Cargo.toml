[package]
name = "mirl_geometry"
version = "0.0.0-alpha"
edition = "2024"
repository.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = [
    "bitcode?/std",
    "mirl_extensions/std",
    "mirl_geometry_core/std",
    "serde?/std",
    "strum?/std",
    "wincode?/std",
    "zerocopy?/std",
]
# Does nothing by itself. Needs another codec or enum flag to do something
mirl_derive = ["dep:mirl_derive", "mirl_geometry_core/mirl_derive"]
# Compatibility with ffi
c_compatible = [
    "mirl_derive",
    "mirl_extensions/c_compatible",
    "mirl_geometry_core/c_compatible",
]
# Enables all codecs
all_codecs = [
    "serde",
    "bitcode",
    "wincode",
    "compactly",
    "zerocopy",
    "mirl_geometry_core/all_codecs",
]
all_enum_extensions = ["strum", "enum_ext", "mirl_geometry_core/all_enum_extensions"]
# Codec stuff
serde = [
    "dep:serde",
    "dep:mirl_derive",
    "mirl_geometry_core/serde",
    "mirl_geometry_core/serde",
    "bitcode?/serde",
]
bitcode = [
    "dep:bitcode",
    "mirl_derive",
    "mirl_geometry_core/bitcode",
    "mirl_geometry_core/bitcode",
]
wincode = [
    "dep:wincode",
    "mirl_derive",
    "mirl_geometry_core/wincode",
    "mirl_geometry_core/wincode",
]
compactly = [
    "dep:compactly",
    "dep:mirl_derive",
    "mirl_geometry_core/serde",
    "mirl_geometry_core/serde",
    "mirl_geometry_core/compactly",
]
zerocopy = [
    "dep:zerocopy",
    "mirl_derive",
    "mirl_geometry_core/zerocopy",
    "mirl_geometry_core/zerocopy",
]
# Enum extensions
strum = ["dep:strum", "mirl_derive", "mirl_geometry_core/strum"]
enum_ext = ["dep:enum_ext", "mirl_derive", "mirl_geometry_core/enum_ext"]

[dependencies]
# All enum extensions
bitcode = { version = "0.6", optional = true, default-features = false, features = [
    "derive",
] }
# Codec
compactly = { version = "0.1", optional = true }
enum_ext = { version = "0.6", optional = true, default-features = false }
mirl_derive = { version = "0.0.0-alpha", optional = true }
mirl_extensions = { version = "0.0.0-alpha" }
# mirl_core = { version = "0.0.0-alpha" }
mirl_geometry_core = { version = "0.0.0-alpha" }
serde = { version = "1.0", optional = true, default-features = false, features = [
    "derive",
] }
# Enum functionality
strum = { version = "0.28", optional = true, default-features = false, features = [
    "derive",
] }
wincode = { version = "0.5", optional = true, features = ["derive"] }
zerocopy = { version = "0.8", optional = true, default-features = false, features = [
    "float-nightly",
    "derive",
] }

[build-dependencies]
mirl_build_tools = { workspace = true }

[lints]
workspace = true
